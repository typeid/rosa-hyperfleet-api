replicaCount: 2

image:
  repository: quay.io/cbusse_openshift/seaplane-operator
  tag: ""
  pullPolicy: IfNotPresent

awsRegion: ""
baseDomain: ""
# Hosted control plane slots on every management cluster, and so the most
# Clusters one holds (must match the MCs' Terraform and hcp-slots chart). Each
# Cluster is placed on a free slot. Required, 1 to 99.
hcpSlotCount: null

# Optional regional Alertmanager base URL for lifecycle silence reconciliation.
# When unset, the silence reconciler is not started.
alertmanager:
  url: ""

# Optional development override for the control-plane-operator image. When set,
# every HostedCluster the operator creates is stamped with the
# hypershift.openshift.io/control-plane-operator-image annotation set to this
# value. When empty, no override is applied.
controlPlaneOperatorImage: ""

postgres:
  secretName: postgres-dsn
  secretKey: dsn

serviceAccount:
  create: true
  name: seaplane-operator
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

compactor:
  enabled: true
  interval: 5m
  retention: 24h
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi

nodeSelector: {}
tolerations: []
